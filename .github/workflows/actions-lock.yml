name: 'Actions Lock'

# Supply-chain guard for .github/workflows/actions.lock.
#
# GitHub enforces the lockfile at run time for every workflow listed in it:
# the locked commit is what executes, and the recorded owner/repo IDs confirm
# the upstream repository is still the one we locked.
#
# This job covers the gap that run-time enforcement cannot: a workflow that was
# never onboarded is not in the lockfile, so nothing checks it. --verify scans
# every workflow and fails if any is missing or stale.
#
# To refresh after adding a workflow or changing a uses::
#   gh actions-lock             # pin and onboard
#   gh actions-lock --relock    # advance moved refs to their current commit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      # Pinned so the guard itself isn't fetched from a mutable "latest".
      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify --no-interactive
